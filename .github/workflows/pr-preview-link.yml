name: PR preview link

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: preview-link-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This privileged job never checks out or executes the PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Add or refresh the PR-page launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/preview/pr-preview-link.mjs
